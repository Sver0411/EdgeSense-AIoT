name: checks

# Everything CI can verify without a device. Hardware validation is deliberately
# absent: a runner has no ESP32 attached, and a green tick that implied hardware
# verification would be worse than no tick at all.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  non-hardware-checks:
    name: non-hardware checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install dev requirements
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: vendor integrity
        run: python scripts/vendor_manifest.py --verify

      - name: config parity
        run: python scripts/check_config_parity.py

      - name: host C tests
        # -Wall -Wextra -Werror on EdgeSense sources, -Wall -Wextra on vendored ones
        run: bash scripts/test_host.sh

      - name: python tests
        run: python -m pytest

      - name: EXP-000 self-check
        run: python experiments/analyze_experiment.py --exp experiments/EXP-000

      - name: static checks
        run: python scripts/static_checks.py

  firmware-build:
    name: firmware build (esp32s3)
    runs-on: ubuntu-latest
    # Kept in its own job: a full ESP-IDF build is minutes long, and a failure here
    # (toolchain or target problem) should not be confused with a logic failure in
    # the checks above.
    steps:
      - uses: actions/checkout@v4

      - name: build sensor node
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.4
          target: esp32s3
          path: firmware/sensor_node
          command: idf.py build

      # Note for a reader of a green run: this step proves the firmware compiles for
      # the target. Nothing here is flashed, and no hardware claim follows from it.
